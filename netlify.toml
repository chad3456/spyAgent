# ─── OSINT Protest Map — Netlify configuration ────────────────────────────────
#
# Frontend deploys to Netlify (free static CDN).
# Backend runs on Render.com (free Python web service).
#
# Required Netlify env var (set in Site Settings → Environment Variables):
#   VITE_API_BASE_URL  =  https://<your-render-service>.onrender.com/api
#
# ──────────────────────────────────────────────────────────────────────────────

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── SPA fallback (React Router / client-side navigation) ─────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ─────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
