# ─── OSINT Intelligence Platform — Netlify configuration ──────────────────────
#
# BACKEND: Deploy the /backend folder to Render.com as a Python web service.
#          See render.yaml for Render config.
#
# CONNECTING FRONTEND TO BACKEND:
#   Option A (recommended — no env var needed):
#     Update the [[redirects]] proxy rule below with your Render URL.
#     The line to edit is marked with: ← UPDATE THIS
#
#   Option B (Netlify dashboard):
#     Set VITE_API_BASE_URL = https://<your-service>.onrender.com
#     in Netlify → Site configuration → Environment variables, then redeploy.
#
# ──────────────────────────────────────────────────────────────────────────────

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION  = "20"
  VITE_USE_DEMO = "false"

# ── API proxy — forwards /api/* to the Render backend ─────────────────────────
# This avoids CORS issues and means the frontend never needs VITE_API_BASE_URL.
# Replace the 'to' URL with your actual Render service URL.
[[redirects]]
  from   = "/api/*"
  to     = "https://osint-protest-map-api.onrender.com/api/:splat"  # ← UPDATE THIS
  status = 200
  force  = true

# ── SPA fallback (must come AFTER the API proxy rule) ─────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets ───────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
